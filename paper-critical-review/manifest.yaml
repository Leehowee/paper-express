name: paper-critical-review
version: 2
description: "渐进加载说明；不是自动执行插件，也不是官方评分表。"
axes:
  scope: [full-paper, section, targeted, recheck]
  lens: [nature, nature-family, tpami, ccf-a, unspecified]
  overlay: [best-paper]
  mode: [single-report, multi-lens, independent-panel-on-request]
always_load:
  - static/core/workflow.md
  - static/core/evidence-and-severity.md
  - static/core/claim-audit.md
lenses:
  nature: static/lenses/nature.md
  nature-family: static/lenses/nature-family.md
  tpami: static/lenses/tpami.md
  ccf-a: static/lenses/ccf-a.md
overlays:
  best-paper: static/lenses/best-paper.md
conditional_load:
  - when: "理论、证明、收敛、复杂度或形式化保证"
    path: static/audits/theory-and-lean.md
  - when: "实验比较、机制、统计、效率或泛化主张"
    path: static/audits/experiments-and-statistics.md
  - when: "图表与文字、数据汇总、坐标或数值一致性"
    path: static/audits/figures-and-consistency.md
  - when: "修改后复审"
    path: static/audits/revision-recheck.md
  - when: "需要把问题交给其他模块处理"
    path: interfaces/modules.md
templates:
  request: assets/templates/review-request.yaml
  report: assets/templates/reviewer-report.md
  concerns: assets/templates/concern-paragraphs.md
  revision_plan: assets/templates/revision-plan.md
  recheck: assets/templates/recheck-report.md
  comparison: assets/templates/multi-lens-comparison.md
  claim_ledger: assets/templates/claim-evidence-ledger.csv
  issue_ledger: assets/templates/issue-ledger.csv
  independent_brief: assets/templates/independent-brief.md
references_on_demand:
  - references/source-basis.md
  - references/nature-adaptation.md
  - references/corpus-lessons.md
  - references/worked-example.md
  - references/usage-examples.md
  - references/validation.md
  - references/source-manifest.json
selection_rules:
  - "完整审查覆盖所有适用主张；局部任务只检查已提供的范围和必要依赖。"
  - "未定目标时先做共用审查，再简要比较视角，不默认任何期刊的格式。"
  - "同一上下文的多视角不是独立审稿，不制造共识或异议。"
  - "用户明确要求独立小组后才选择 independent-panel-on-request；上下文必须实际隔离。"
  - "没有问题配额，不要求每篇论文都有理论、新数据集或所有类型实验。"
  - "只对决定判断的事实补查来源，不用未经核实的记忆宣称文献已覆盖该贡献。"
